[package]
name = "repose-bevy"
version = "0.3.0"
edition = "2024"
license = "LGPL-2.1-or-later"
description = "Bevy integration for the Repose Compose-like UI toolkit"
repository = "https://github.com/mlm-games/repose-bevy"
readme = "README.md"
keywords = ["bevy", "ui", "repose", "compose", "wgpu"]
categories = ["game-development", "gui"]
rust-version = "1.98"

[features]
default = ["shared-device"]
offscreen = ["dep:pollster", "dep:image"]
shared-device = []

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_window",
    "bevy_winit",
    "bevy_image",
    "bevy_ui",
    "bevy_text",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_ui_render",
    "bevy_camera",
    "bevy_state",
    "async_executor",
    "bevy_color",
    "bevy_animation",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "reflect_auto_register",
    "bevy_clipboard",
    "default_font",
    "custom_cursor",
    "png",
    "x11",
    "wayland",
] }

repose-core = "=0.31.21"
repose-ui = "=0.31.21"
repose-app = "=0.31.21"
repose-render-wgpu = { version = "=0.31.21", default-features = false }
repose-text = "=0.31.21"

log = "0.4"
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
web-time = "1"
parking_lot = "0.12"

pollster = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = [
    "png",
], optional = true }

wgpu = "30"

[[example]]
name = "counter"
path = "examples/counter.rs"

[[example]]
name = "hud"
path = "examples/hud.rs"

[[example]]
name = "world_inspector"
path = "examples/world_inspector.rs"

[[example]]
name = "idiomatic"
path = "examples/idiomatic.rs"

# Local development only — patches do not propagate to dependents.
# Uncomment for local `../repose` work:
# [patch.crates-io]
# repose-core = { path = "../repose/crates/repose-core" }
# repose-ui = { path = "../repose/crates/repose-ui" }
# repose-app = { path = "../repose/crates/repose-app" }
# repose-render-wgpu = { path = "../repose/crates/repose-render-wgpu" }
# repose-text = { path = "../repose/crates/repose-text" }
